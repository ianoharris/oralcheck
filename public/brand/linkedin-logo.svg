<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed teal. The web icon is a circle on transparency, so LinkedIn's
       square container filled the corners with white. This fills the square. -->
  <rect width="512" height="512" fill="#0d7377"/>

  <!-- Mark scaled to ~78% so it has margin inside the square and survives
       LinkedIn's rounded-corner masking at small sizes. -->
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <circle cx="256" cy="256" r="128" fill="none" stroke="#faf9f6" stroke-width="34"/>
    <circle cx="380" cy="168" r="42" fill="#e8634a"/>
  </g>
</svg>
