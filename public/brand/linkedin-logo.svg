<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Square, fully filled. The web icon is a circle on transparency, so
       LinkedIn's square container rendered the corners white.

       Geometry is identical to icon.svg with NO rescaling: the ring stays 57%
       of the canvas and the coral dot 16%. An earlier version scaled the group
       to 0.78 for "margin", which quietly shrank the dot to 13% and made the
       whole mark read small. Nothing clips at full size (the ring spans
       111-401 and the dot 338-422 inside a 512 box), so the scaling bought
       nothing. -->
  <rect width="512" height="512" fill="#0d7377"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#faf9f6" stroke-width="34"/>
  <circle cx="380" cy="168" r="42" fill="#e8634a"/>
</svg>
