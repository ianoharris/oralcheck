name: OralCheck Idea Flow

# Hands-off from your phone:
#   1. Researches the web and sends a numbered idea batch to Telegram
#   2. Waits for your reply naming the numbers you want (e.g. "1, 3, 8")
#   3. Generates those posts and sends each back as a swipeable deck to approve
#   4. Posts approved decks to Instagram
on:
  schedule:
    - cron: '0 14 * * 1'   # every Monday 14:00 UTC (~8am Central) — start of the week
    # Backup run. GitHub delays or silently drops scheduled workflows during
    # incidents and periods of high load, and a dropped cron produces no run and
    # no notification, so a missed week looks identical to a quiet week. This
    # fires later the same day and the "Skip if already run today" step below
    # exits immediately when the 14:00 run already succeeded.
    - cron: '0 19 * * 1'   # Monday 19:00 UTC, five hours later
  workflow_dispatch:
    inputs:
      count:
        description: 'Ideas per format (carousel, reel, image) — 3 gives 9 total'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 840   # pick window + approval window across the day (public repo, free minutes)

    defaults:
      run:
        working-directory: oralcheck-agent

    steps:
      - uses: actions/checkout@v4

      # The backup cron must not double-post. A manual dispatch always runs, so
      # a run can still be forced after a successful one if needed.
      - name: Skip if already run today
        if: github.event_name == 'schedule'
        id: guard
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%Y-%m-%d)
          done_today=$(gh run list \
            --workflow "${{ github.workflow }}" --limit 30 \
            --json conclusion,createdAt,databaseId \
            --jq "[.[] | select(.createdAt | startswith(\"$today\"))
                      | select(.databaseId != ${{ github.run_id }})
                      | select(.conclusion == \"success\" or .conclusion == \"cancelled\")]
                  | length")
          echo "completed runs already today: ${done_today:-0}"
          if [ "${done_today:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      # apt, PyPI and the Playwright CDN are the steps that actually fail when
      # GitHub or its network is degraded. Each retries rather than failing the
      # whole day's run on one bad fetch.
      - name: Install system deps
        if: steps.guard.outputs.skip != 'true'
        working-directory: .
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg && exit 0
            echo "apt attempt $i failed; retrying in $((i * 20))s"; sleep $((i * 20))
          done
          exit 1

      - name: Install Python deps
        if: steps.guard.outputs.skip != 'true'
        run: |
          for i in 1 2 3; do
            pip install anthropic httpx pillow python-dotenv playwright && exit 0
            echo "pip attempt $i failed; retrying in $((i * 20))s"; sleep $((i * 20))
          done
          exit 1

      - name: Install Playwright browsers
        if: steps.guard.outputs.skip != 'true'
        run: |
          for i in 1 2 3; do
            python -m playwright install chromium --with-deps && exit 0
            echo "playwright attempt $i failed; retrying in $((i * 20))s"; sleep $((i * 20))
          done
          exit 1

      - name: Verify render + content logic
        if: steps.guard.outputs.skip != 'true'
        run: python test_render.py && python test_content.py && python test_review.py

      - name: Suggest ideas (sends to Telegram)
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python oralcheck_agent.py --ideas ${{ inputs.count || '3' }}

      - name: Await your pick, then generate the posts
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python oralcheck_agent.py --await-picks

      - name: Review, schedule across the week, and replace rejects
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          # Two Instagram posts and one LinkedIn post a week. Each entry costs
          # one Publora scheduled-post slot and the Starter plan allows three,
          # so this sits exactly at the cap.
          WEEKLY_PLAN: 'instagram:2,linkedin:1'
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          # needed so a rejected post can be regenerated from a spare idea
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
        run: python telegram_review.py

      - name: Save idea ledger state
        if: steps.guard.outputs.skip != 'true'
        working-directory: .
        run: |
          git config user.name "OralCheck Bot"
          git config user.email "bot@oralcheck.org"
          git add oralcheck-agent/ideas.json oralcheck-agent/used_photos.json \
            oralcheck-agent/hooks.json oralcheck-agent/schedule.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: idea ledger [skip ci]"
          # A run holds master from checkout until the review finishes, which is
          # hours. Anything landing on master in that window (a push, or the SEO
          # pipeline committing an article) makes this push a non-fast-forward
          # and the ledger is lost with the runner: which ideas were used, which
          # photos, which hooks, and which days are already booked. Rebase and
          # retry. These are append-mostly JSON files owned by this workflow, so
          # replaying the commit on top of the newer master is the right merge.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Ledger pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing onto the newer master (attempt $attempt)..."
            git pull --rebase --autostash origin master || {
              echo "Rebase conflicted; leaving master untouched." >&2
              exit 1
            }
            sleep $((attempt * 3))
          done
          echo "Could not push the ledger after 5 attempts." >&2
          exit 1
