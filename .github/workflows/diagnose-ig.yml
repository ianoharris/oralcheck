name: Diagnose Instagram Token

# Reports what the Instagram access token can do (account, publishing quota,
# Imgbb key) without publishing anything. Prints no secrets. Run it after
# setting a new token, before turning IG_DIRECT on.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oralcheck-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - name: Check Instagram token
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          META_GRAPH_HOST: ${{ vars.META_GRAPH_HOST }}
        run: python meta_ig.py check
      - name: Probe a real picture and reel (nothing is published)
        env:
          GH_TOKEN: ${{ github.token }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          META_GRAPH_HOST: ${{ vars.META_GRAPH_HOST }}
        run: |
          IMG=$(gh release view calendar-2026-fall --json assets -q '.assets[].name' | grep -m1 '\.jpg$')
          REEL=$(gh release view calendar-2026-fall --json assets -q '.assets[].name' | grep -m1 '\.mp4$')
          gh release download calendar-2026-fall --pattern "$IMG" --dir /tmp/probe --clobber
          python meta_ig.py probe "/tmp/probe/$IMG" "$REEL"
