<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=4608">
<title>OralCheck Design Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* 48 x 36 in landscape. 1in = 96px, so the sheet is 4608 x 3456 px.
     Body text is 39px = 29pt; nothing on the sheet is below 28pt except the
     reference list (26pt) and figure axis numerals. */
  @page { size: 48in 36in; margin: 0; }
  :root {
    --teal: #0d7377; --teal-dark: #095458; --teal-soft: #e0f0f0;
    --coral: #e8634a; --coral-dark: #c84d35;
    --warm: #faf9f6; --warm-dim: #f0eee8;
    --ink: #2d2d2d; --ink-soft: #5f5f5f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 48in; height: 36in; background: var(--warm); }
  body {
    font-family: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif;
    font-size: 38px; line-height: 1.3; color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    overflow: hidden;
  }
  .sheet { width: 48in; height: 36in; display: flex; flex-direction: column; }

  /* title band */
  header {
    background: var(--teal); color: #fff; height: 5.25in;
    padding: 0.4in 0.8in 0.4in 0.8in;
    display: flex; align-items: center; gap: 0.8in;
    border-bottom: 0.22in solid var(--coral);
  }
  header .titles { flex: 1; }
  header .kicker {
    font-size: 40px; letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 700; color: #bfe3e3; margin-bottom: 18px;
  }
  header h1 {
    font-family: "DM Serif Display", Georgia, serif; font-weight: 400;
    font-size: 132px; line-height: 1.04; letter-spacing: -0.005em;
  }
  header .author { margin-top: 26px; font-size: 54px; font-weight: 600; }
  header .author span { font-weight: 400; color: #d6eeee; }
  header .qrbox {
    background: #fff; border-radius: 24px; padding: 26px 26px 18px;
    display: flex; flex-direction: column; align-items: center; color: var(--ink);
  }
  header .qrbox svg { width: 3.55in; height: 3.55in; display: block; }
  header .qrbox .url { font-size: 52px; font-weight: 700; color: var(--teal-dark); margin-top: 6px; }
  header .qrbox .cap { font-size: 34px; color: var(--ink-soft); }

  main {
    flex: 1; display: grid;
    grid-template-columns: 1fr 1fr 1.08fr 1fr;
    gap: 0.6in; padding: 0.45in 0.8in 0.4in;
    min-height: 0;
  }
  .col { display: flex; flex-direction: column; gap: 0.3in; min-height: 0; }
  section h2 {
    font-family: "DM Serif Display", Georgia, serif; font-weight: 400;
    font-size: 80px; line-height: 1.05; color: var(--teal-dark);
    padding-bottom: 10px; margin-bottom: 18px;
    border-bottom: 6px solid var(--coral);
  }
  section h3 { font-size: 44px; font-weight: 700; color: var(--teal-dark); margin: 18px 0 8px; }
  p + p { margin-top: 16px; }
  ul { padding-left: 1.05em; }
  li { margin-top: 10px; }
  li::marker { color: var(--coral); }
  b, strong { font-weight: 700; }
  .lede { font-size: 43px; line-height: 1.26; }
  p.after { margin-top: 18px; }
  figure.tight { padding: 18px 22px 16px; margin: 18px 0; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin: 6px 0 16px; }
  .stat { background: var(--warm-dim); border-radius: 18px; padding: 16px 24px; }
  .stat .n { font-family: "DM Serif Display", Georgia, serif; font-size: 84px; line-height: 1; color: var(--teal-dark); }
  .stat.c .n { color: var(--coral-dark); }
  .stat .l { font-size: 36px; line-height: 1.22; margin-top: 8px; }

  figure { background: #fff; border: 3px solid #e4e1da; border-radius: 18px; padding: 26px 28px 22px; }
  figure svg { display: block; font-family: "Source Sans 3", system-ui, sans-serif; }
  figcaption { font-size: 32px; line-height: 1.28; color: var(--ink-soft); margin-top: 14px; }
  figcaption b { color: var(--ink); }

  .formula {
    background: var(--teal); color: #fff; border-radius: 18px;
    padding: 22px 30px; text-align: center; margin: 4px 0 14px;
  }
  .formula .eq { font-family: "DM Serif Display", Georgia, serif; font-size: 68px; line-height: 1.1; }
  .formula .sub { font-size: 34px; color: #d6eeee; margin-top: 6px; }

  .callout {
    border-left: 14px solid var(--coral); background: #fdf0ec;
    padding: 20px 26px; border-radius: 0 18px 18px 0;
  }
  .callout h3 { margin-top: 0; color: var(--coral-dark); }
  .callout ul { margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 38px; line-height: 1.2; }
  thead th { text-align: left; font-size: 34px; color: var(--ink-soft); font-weight: 700; padding: 0 10px 10px; border-bottom: 4px solid var(--ink); }
  tbody th { text-align: left; font-weight: 700; vertical-align: top; padding: 8px 10px 8px 0; width: 27%; }
  tbody td { padding: 5px 0 8px 6px; vertical-align: top; }
  tbody tr { border-bottom: 2px solid #e4e1da; }
  tbody tr.int { border-bottom: 4px solid var(--ink); }
  .chip {
    display: inline-block; background: var(--teal-soft); color: var(--teal-dark);
    border-radius: 10px; padding: 1px 12px; margin: 2px 6px 2px 0; white-space: nowrap;
  }
  .chip b { color: var(--ink); }
  .chip.zero { background: var(--warm-dim); color: var(--ink-soft); }
  .chip.dep { background: var(--coral); color: #fff; }
  .chip.dep b { color: #fff; }
  .chip.non { background: #fff; color: var(--ink-soft); outline: 3px dashed #9a968e; outline-offset: -3px; }
  .orb { font-size: 33px; color: var(--ink-soft); margin-top: 0; }
  .ref { color: var(--teal-dark); font-weight: 600; }
  .key { font-size: 32px; color: var(--ink-soft); margin-top: 14px; line-height: 1.5; }
  .key .chip { font-size: 30px; }

  .refs { font-size: 30px; line-height: 1.2; padding-left: 1.6em; }
  .refs li { margin-top: 3px; }
  .refs li::marker { color: var(--teal-dark); font-weight: 700; }

  .note { font-size: 34px; color: var(--ink-soft); }
.tierlist { list-style: none; padding: 0; margin-top: 10px; font-size: 37px; }
  .tierlist li { margin-top: 6px; display: flex; gap: 16px; align-items: baseline; }
  .tierlist .sc { display: inline-block; min-width: 2.1em; text-align: center; font-weight: 700; color: #fff; border-radius: 10px; padding: 0 8px; }
  .override { margin-top: 16px; border: 4px solid #b5432d; border-radius: 14px; padding: 12px 20px; font-size: 36px; background: #fff; }
  .override b { color: #b5432d; }
</style>
</head>
<body>
<div class="sheet">
<header>
  <div class="titles">
    <div class="kicker">Design of a public-health tool</div>
    <h1>OralCheck: a free, private oral cancer risk questionnaire with weights drawn mainly from published odds ratios</h1>
    <div class="author">Ian Harris, OralCheck (independent project) <span>&nbsp;·&nbsp; [email]</span></div>
  </div>
  <div class="qrbox">
    {{QR}}
    <div class="url">oralcheck.org</div>
    <div class="cap">Free, no account, nothing stored</div>
  </div>
</header>
