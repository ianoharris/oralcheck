<!doctype html>
<!--
  "The HPV vaccine works best before exposure. It's still available after."
  (calendar 1 Dec 2026, Ian's redo of the Gardasil image: "turn this into a
  video"). 2D in the house style: an age line from 0 to 50 that the shield
  travels along. Teal is the approved range; the routine age, 11 or 12, takes
  the reel's one coral beat.
  Facts: topics.py hpv_vaccine (Gardasil 9, HPV-16 and HPV-18, FDA-approved
  for ages 9 through 45); CDC, "HPV Vaccination Considerations" (routine at 11
  or 12, can start at 9, recommended through 26 if not vaccinated earlier,
  27 through 45 by shared decision with a clinician, prevents new infections
  but does not treat existing ones), checked 5 Nov 2026.
-->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="house.css">
<style>
  #stage svg{display:block;width:1080px;height:1000px}
  .tick{font:500 26px "Source Sans 3",sans-serif;fill:#8a9796}
  .zone{font:600 26px "Source Sans 3",sans-serif}
  .num{font:400 40px "DM Serif Display",serif;fill:#fff}
</style></head>
<body>
<div id="stage"><svg viewBox="0 0 1080 1000"></svg></div>
<script type="module">
import {PLAN, at, label, readout, frame, span, ease, lerp} from "./house.js";
const NS = "http://www.w3.org/2000/svg";
const svg = document.querySelector("#stage svg");
const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
svg.innerHTML = `<defs>
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="14" height="14" fill="#cfe6e6"/><line x1="0" y1="0" x2="0" y2="14" stroke="#0d7377" stroke-width="5" opacity=".55"/></pattern></defs>`;

// ---- the age line ------------------------------------------------------------
const AX0 = 110, AX1 = 970, AY = 700;
const xAge = a => AX0 + (AX1 - AX0) * a / 50;
const axis = el("line", {x1: AX0, y1: AY, x2: AX0, y2: AY, stroke: "#c9d1d1", "stroke-width": 4, "stroke-linecap": "round"});
const ticks = [0, 10, 20, 30, 40, 50].map(a => { const t = el("text", {x: xAge(a), y: AY + 54, "text-anchor": "middle", class: "tick"}); t.textContent = a; return t; });
const band = el("rect", {x: xAge(9), y: AY - 22, width: 0, height: 44, rx: 22, fill: "#0d7377"});
const catchup = el("rect", {x: xAge(13), y: AY - 22, width: xAge(26) - xAge(13), height: 44, rx: 8, fill: "#0d7377", opacity: 0});
const shared = el("rect", {x: xAge(27), y: AY - 22, width: xAge(45) - xAge(27), height: 44, rx: 8, fill: "url(#hatch)", opacity: 0});
const routine = el("rect", {x: xAge(11), y: AY - 30, width: xAge(12) - xAge(11) + 6, height: 60, rx: 10, fill: "#e8634a", opacity: 0});
const zl1 = el("text", {x: (xAge(13) + xAge(26)) / 2, y: AY - 44, "text-anchor": "middle", class: "zone", fill: "#0d7377", opacity: 0}); zl1.textContent = "Catch-up";
const zl2 = el("text", {x: (xAge(27) + xAge(45)) / 2, y: AY - 44, "text-anchor": "middle", class: "zone", fill: "#4a5958", opacity: 0}); zl2.textContent = "Ask your clinician";

// ---- the shield ----------------------------------------------------------------
const shield = el("g", {});
const SH = "M0,-120 C40,-96 84,-88 110,-90 C112,10 82,84 0,130 C-82,84 -112,10 -110,-90 C-84,-88 -40,-96 0,-120 Z";
const shFill = el("path", {d: SH, fill: "#e5f1f1"}, shield);
const shLine = el("path", {d: SH, fill: "none", stroke: "#0d7377", "stroke-width": 8, "stroke-linejoin": "round"}, shield);
const shLen = 760;
shLine.setAttribute("stroke-dasharray", shLen);

// ---- virus particles: nine types in the vaccine, two of them 16 and 18 ---------
function particle(r, fill) {
  const g = el("g", {});
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2;
    el("line", {x1: Math.cos(a) * r, y1: Math.sin(a) * r, x2: Math.cos(a) * (r + 12), y2: Math.sin(a) * (r + 12), stroke: fill, "stroke-width": 5, "stroke-linecap": "round"}, g);
    el("circle", {cx: Math.cos(a) * (r + 14), cy: Math.sin(a) * (r + 14), r: 5, fill}, g);
  }
  const c = el("circle", {r, fill}, g);
  return {g, c};
}
const P = Array.from({length: 9}, (_, i) => {
  const p = particle(34, "#c9d1d1");
  const ang = i / 9 * Math.PI * 2 - Math.PI / 2;
  p.home = [540 + Math.cos(ang) * 300, 450 + Math.sin(ang) * 200];
  return p;
});
const key = [P[0], P[4]];
["16", "18"].forEach((s, j) => { const t = el("text", {x: 0, y: 14, "text-anchor": "middle", class: "num"}, key[j].g); t.textContent = s; key[j].label = t; });
// for the last shot: one particle meets the shield and turns away, one is already inside
const outsider = particle(30, "#9aa6a5"), insider = particle(30, "#9aa6a5");

const T = Object.fromEntries(PLAN.shots.map(s => [s.key, s.t0]));
const view = ([cx, cy, w]) => { const h = w * 1000 / 1080; svg.setAttribute("viewBox", [cx - w / 2, cy - h / 2, w, h].map(v => v.toFixed(1)).join(" ")); };
const toScreen = ([cx, cy, w], x, y) => { const h = w * 1000 / 1080; return [(x - (cx - w / 2)) / w * 1080, 230 + (y - (cy - h / 2)) / h * 1000]; };
const mix = (a, b, k) => a.map((v, j) => lerp(v, b[j], k));
const show = (e, k) => { e.style.opacity = k; e.style.display = k > 0.001 ? "" : "none"; };

window.render = (t) => {
  const {sh, local} = at(t);
  // camera: centred on the shield at first, then on the age line, never still
  const C0 = [540, 470, 1000], C1 = [540, 560, 1080], C2 = [330, 640, 700];
  let box = mix(C0, C1, ease(span(t, T.range - 0.3, T.range + 1.2)));
  if (t >= T.routine) box = mix(box, C2, ease(span(t, T.routine, T.routine + 1.2)) * (1 - ease(span(t, T.adults, T.adults + 1.2))));
  box = [box[0] + 5 * Math.sin(t * 0.6), box[1], box[2] * (1 - 0.014 * Math.sin(t * 0.7))];
  view(box);

  // shield: draws itself in the hook, rides to the start of the band, comes back big at the end
  const draw = ease(span(t, 0.1, 1.6));
  shLine.setAttribute("stroke-dashoffset", shLen * (1 - draw));
  shFill.style.opacity = span(t, 1.0, 1.8);
  const toLine = ease(span(t, T.range - 0.2, T.range + 1.0)), back = ease(span(t, T.limits, T.limits + 1.0));
  const sx = lerp(lerp(540, xAge(9), toLine), 540, back), sy = lerp(lerp(470, AY - 150, toLine), 430, back);
  const ss = lerp(lerp(1.5, 0.45, toLine), 1.3, back) * (1 + 0.02 * Math.sin(t * 1.3));
  shield.setAttribute("transform", `translate(${sx},${sy}) scale(${ss})`);
  show(shield, 1 - ease(span(t, T.strains - 0.2, T.strains + 0.5)) * (1 - span(t, T.routine, T.routine + 0.5)) * (1 - back) || back);

  // age line and the approved band
  const lineK = ease(span(t, T.range - 0.1, T.range + 1.0));
  axis.setAttribute("x2", lerp(AX0, AX1, lineK));
  ticks.forEach((tk, i) => show(tk, span(t, T.range + i * 0.12, T.range + 0.4 + i * 0.12) * (1 - back * 0.7)));
  const bandK = ease(span(t, T.range + 0.8, T.range + 2.4));
  band.setAttribute("width", (xAge(45) - xAge(9)) * bandK);
  const dimForSplit = span(t, T.adults, T.adults + 0.8);
  band.style.opacity = (1 - 0.65 * span(t, T.strains, T.strains + 0.4) * (1 - span(t, T.routine, T.routine + 0.4))) * (1 - 0.85 * dimForSplit) * (1 - back * 0.8);
  show(routine, span(t, T.routine + 0.4, T.routine + 1.0) * (1 - 0.7 * dimForSplit) * (1 - back));
  [catchup, shared].forEach((z, i) => show(z, span(t, T.adults + 0.4 + i * 0.9, T.adults + 1.2 + i * 0.9) * (1 - back * 0.8)));
  show(zl1, span(t, T.adults + 0.8, T.adults + 1.4) * (1 - back)); show(zl2, span(t, T.adults + 1.7, T.adults + 2.3) * (1 - back));

  // particles: gather in "strains", 16 and 18 turn teal
  const pIn = ease(span(t, T.strains, T.strains + 1.2)), pOut = span(t, T.routine - 0.2, T.routine + 0.6);
  P.forEach((p, i) => {
    const [hx, hy] = p.home, d = 1 + 0.03 * Math.sin(t * 1.1 + i);
    p.g.setAttribute("transform", `translate(${lerp(540, hx, pIn) + 6 * Math.sin(t + i)},${lerp(400, hy, pIn) * d - 140 * pOut}) rotate(${key.includes(p) ? 0 : t * 12 + i * 20})`);   // 16 and 18 stay upright so they read
    show(p.g, pIn * (1 - pOut));
  });
  const keyK = span(t, T.strains + 1.3, T.strains + 2.0);
  key.forEach(p => { p.g.querySelectorAll("circle,line").forEach(n => { const c = `rgb(${lerp(201, 13, keyK)},${lerp(209, 115, keyK)},${lerp(209, 119, keyK)})`; n.tagName === "line" ? n.setAttribute("stroke", c) : n.setAttribute("fill", c); }); p.label.style.opacity = keyK; });

  // last shot: one particle bounces off the shield, one already inside stays
  const lk = t - T.limits;
  const approach = ease(span(lk, 0.6, 1.6)), bounce = ease(span(lk, 1.6, 2.6));
  outsider.g.setAttribute("transform", `translate(${lerp(980, 720, approach) + 220 * bounce},${lerp(220, 380, approach) - 160 * bounce}) rotate(${t * 20})`);
  show(outsider.g, span(lk, 0.3, 0.7) * (1 - span(lk, 3.2, 3.8)));
  insider.g.setAttribute("transform", `translate(${540 + 8 * Math.sin(t * 1.4)},${450}) rotate(${-t * 15}) scale(.9)`);
  show(insider.g, span(lk, 2.4, 3.0));

  // labels and readout
  if (sh.key === "strains") { const [x, y] = toScreen(box, key[0].home[0], key[0].home[1] - 50); label({k: "Two of the nine types it covers", t: "HPV 16 and 18", d: "behind most HPV-related cancers"}, x, y, "left", local, 290); }
  else if (sh.key === "routine") { const [x, y] = toScreen(box, xAge(11.5), AY - 30); label({k: "Recommended", t: "At 11 or 12", d: "It can start at 9"}, x, y, "right", local, 300); }
  else if (sh.key === "limits") { const [x, y] = toScreen(box, 540, 450); label({k: "Prevents new infections", t: "It can't treat", d: "one you already have"}, x, y, "left", local, 290); }
  else label(null);
  if (sh.key === "range") readout("9 to 45", "FDA-approved ages, Gardasil 9", 0, span(local, 1.2, 1.8));
  else if (sh.key === "adults") readout(local < 2.2 ? "Through 26" : "27 to 45", local < 2.2 ? "catch-up is recommended" : "a decision with your clinician", 0, span(local, 0.6, 1.1));
  else readout("", "", 0, 0);
  return frame(t);
};
</script>
</body></html>
