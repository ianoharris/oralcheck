<!doctype html>
<!--
  "How common is oral cancer at 25? At 45? At 65?" (calendar 19 Nov 2026,
  Ian's redo of the age carousel: "turn this into an animated video").
  A 2D chart in the house style: the five-year age bars grow band by band,
  the camera starts close on the tiny early bars and pulls back as the rate
  climbs, and the 45-and-over bars take the reel's one coral beat.
  Facts: SEER*Explorer age-specific rates (SEER 21, 2019 to 2023, per 100,000,
  five-year groups) and Stat Facts' share of new cases by age (94% at 45 and
  over), both copied from src/lib/seerStats.ts (SEER_BY_AGE, newCaseShareByAge).
-->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="house.css">
<style>
  #stage svg{display:block;width:1080px;height:1000px}
  .tick{font:500 24px "Source Sans 3",sans-serif;fill:#8a9796}
  .q{font:400 64px "DM Serif Display",serif;fill:#0d7377}
  .axis{font:500 22px "Source Sans 3",sans-serif;fill:#8a9796}
</style></head>
<body>
<div id="stage"><svg viewBox="0 0 1080 1000"></svg></div>
<script type="module">
import {PLAN, at, label, readout, frame, span, ease, lerp, smooth} from "./house.js";
const NS = "http://www.w3.org/2000/svg";
const svg = document.querySelector("#stage svg");
const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

// SEER_BY_AGE.ratePer100k (src/lib/seerStats.ts)
const DATA = [["15", 0.4], ["20", 0.6], ["25", 1.1], ["30", 1.8], ["35", 3.0], ["40", 5.5], ["45", 10.2], ["50", 18.8],
              ["55", 29.0], ["60", 38.6], ["65", 45.3], ["70", 49.0], ["75", 50.9], ["80", 51.6], ["85", 49.8], ["90+", 46.6]];
const X0 = 120, BW = 50, GAP = 7, BASE = 860, H = 660, MAX = 52;
const xOf = i => X0 + i * (BW + GAP);
const hOf = v => v / MAX * H;

el("line", {x1: X0 - 20, y1: BASE, x2: xOf(15) + BW + 20, y2: BASE, stroke: "#c9d1d1", "stroke-width": 2});
const grid = [10, 20, 30, 40, 50].map(v => {
  el("line", {x1: X0 - 20, y1: BASE - hOf(v), x2: xOf(15) + BW + 20, y2: BASE - hOf(v), stroke: "#e2e6e5", "stroke-width": 1.5});
  return el("text", {x: X0 - 28, y: BASE - hOf(v) + 8, "text-anchor": "end", class: "axis"}).appendChild(document.createTextNode(v)).parentNode;
});
const bars = DATA.map(([lab], i) => {
  const r = el("rect", {x: xOf(i), width: BW, y: BASE, height: 0, rx: 6, fill: "#c9d1d1"});
  el("text", {x: xOf(i) + BW / 2, y: BASE + 36, "text-anchor": "middle", class: "tick"}).textContent = lab;
  return r;
});
// the three ages the hook asks about
const QS = [[2, "25?"], [6, "45?"], [10, "65?"]].map(([i, s]) => {
  const t = el("text", {x: xOf(i) + BW / 2, y: BASE - 60, "text-anchor": "middle", class: "q"}); t.textContent = s; return [i, t];
});

const T = Object.fromEntries(PLAN.shots.map(s => [s.key, s.t0]));
const view = ([cx, cy, w]) => { const h = w * 1000 / 1080; svg.setAttribute("viewBox", [cx - w / 2, cy - h / 2, w, h].map(v => v.toFixed(1)).join(" ")); };
const toScreen = ([cx, cy, w], x, y) => { const h = w * 1000 / 1080; return [(x - (cx - w / 2)) / w * 1080, 230 + (y - (cy - h / 2)) / h * 1000]; };
const WIDE = [560, 520, 1080], LOW = [300, 760, 520];
const mix = (a, b, k) => a.map((v, j) => lerp(v, b[j], k));
const TEAL = [13, 115, 119], GREY = [201, 209, 209], CORAL = [232, 99, 74];
const rgb = c => `rgb(${c.map(Math.round).join(",")})`;
const blend = (a, b, k) => a.map((v, j) => lerp(v, b[j], k));

window.render = (t) => {
  const {sh, local} = at(t);
  // how much of each bar has grown: up to 25-29 in "at25", to 50-54 in "double", the rest in "by65"
  const grown = i => {
    if (i <= 2) return ease(span(t, T.at25 + i * 0.25, T.at25 + i * 0.25 + 0.9));
    if (i <= 7) return ease(span(t, T.double + (i - 3) * 0.55, T.double + (i - 3) * 0.55 + 0.9));
    return ease(span(t, T.by65 + (i - 8) * 0.22, T.by65 + (i - 8) * 0.22 + 0.8));
  };
  // camera: close on the small bars, then out as they climb, never still
  let box = WIDE;
  if (t < T.double) box = mix(WIDE, LOW, ease(span(t, T.at25 - 0.4, T.at25 + 1.0)));
  else box = mix(LOW, WIDE, ease(span(t, T.double + 0.6, T.double + 3.4)));
  box = [box[0] + 6 * Math.sin(t * 0.5), box[1], box[2] * (1 - 0.015 * Math.sin(t * 0.7))];
  view(box);

  const coral = span(t, T.share, T.share + 0.8) * (1 - span(t, T.any, T.any + 0.8));
  const youngTeal = span(t, T.any + 0.3, T.any + 1.2);
  DATA.forEach(([, v], i) => {
    const g = grown(i);
    bars[i].setAttribute("height", hOf(v) * g);
    bars[i].setAttribute("y", BASE - hOf(v) * g);
    let c = GREY;
    const active = (sh.key === "at25" && i === 2) || (sh.key === "double" && i >= 3 && i <= 7 && t > T.double + (i - 3) * 0.55)
      || (sh.key === "by65" && i === 10);
    if (active) c = TEAL;
    if (sh.key === "share" || (sh.key === "any" && coral > 0)) c = i >= 6 ? blend(GREY, CORAL, coral) : GREY;
    if (sh.key === "any" && i < 6) c = blend(GREY, TEAL, youngTeal);
    bars[i].setAttribute("fill", rgb(c));
  });
  // hook: the three questions rise over an empty chart, then fade as bars arrive
  QS.forEach(([i, q], n) => {
    const k = ease(span(t, 0.2 + n * 0.6, 0.8 + n * 0.6)) * (1 - span(t, T.at25, T.at25 + 0.5));
    q.style.opacity = k; q.setAttribute("y", BASE - 40 - 30 * k);
  });

  // the bar the doubling shot is on: the latest one to start growing
  const cur = () => { let i = 3; for (let j = 3; j <= 7; j++) if (t > T.double + (j - 3) * 0.55) i = j; return i; };
  // labels and readout
  const top = (i) => { const [x, y] = toScreen(box, xOf(i) + BW / 2, BASE - hOf(DATA[i][1]) * grown(i)); return [x, y]; };
  if (sh.key === "at25") { const [x, y] = top(2); label({k: "Age 25 to 29", t: "About 1 in 100,000", d: "new cases a year"}, x, y, "right", local, 330); }
  else if (sh.key === "double") { const [x, y] = top(cur()); label({k: "From your 20s to your 50s", t: "It roughly doubles", d: "every five years"}, x, y, "left", local, 300); }
  else if (sh.key === "by65") { const [x, y] = top(10); label({k: "Age 65 to 69", t: "45 per 100,000", d: "and it peaks near 51 at 75 to 84"}, x, y, "left", local, 300); }
  else if (sh.key === "any") { const [x, y] = top(4); label({k: "Small is not zero", t: "Two weeks", d: "is the line, at any age"}, x, y, "left", local, 300); }
  else label(null);

  const counting = i => DATA[i][1] * grown(i);
  if (sh.key === "at25") readout(counting(2).toFixed(1), "per 100,000 a year, age 25 to 29", 0, span(local, 0.2, 0.7));
  else if (sh.key === "double") { const i = cur();
    readout(counting(i).toFixed(1), `per 100,000 a year, age ${DATA[i][0]} to ${+DATA[i][0] + 4}`, 0, 1); }
  else if (sh.key === "by65") readout(counting(10).toFixed(1), "per 100,000 a year, age 65 to 69", 0, span(grown(10), 0.05, 0.4));
  else if (sh.key === "share") readout(`${Math.round(94 * ease(span(local, 0.1, 1.4)))}%`, "of new cases are in people 45 and older", 0, span(local, 0, 0.5));
  else readout("", "", 0, 0);
  return frame(t);
};
</script>
</body></html>
